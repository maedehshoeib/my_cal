# docker-compose.yml (Production Ready)
version: '3.8'

services:
  backend:
  build:
    context: .
    dockerfile: Dockerfile.backend
  ports:
    - "8000:8000"
  environment:
    - ENV=production
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/"] 
    interval: 10s
    timeout: 5s
    retries: 5


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
       
    restart: unless-stopped
